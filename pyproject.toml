[build-system]
requires = ["setuptools>=64.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "git2svn"
dynamic = ["version"]
description = "CLI utility to synchronize changes from a local Git repository to a local SVN working copy"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "Simon" }
]
keywords = ["git", "svn", "subversion", "synchronize", "replay", "stage", "vcs"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.urls]
Homepage = "https://github.com/simon123h/git2svn"
Documentation = "https://github.com/simon123h/git2svn#readme"
Repository = "https://github.com/simon123h/git2svn.git"
Issues = "https://github.com/simon123h/git2svn/issues"
Changelog = "https://github.com/simon123h/git2svn/releases"

[project.optional-dependencies]
dev = [
    "coverage>=7.0.0",
    "mypy>=1.9.0",
    "ruff>=0.8.0",
    "setuptools-scm>=8.0",
]

[project.scripts]
git2svn = "git2svn.cli:main"

[tool.setuptools_scm]
write_to = "git2svn/_version.py"
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"


[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.coverage.run]
source = ["git2svn"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.setuptools.package-data]
git2svn = ["py.typed"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_return_any = true
show_error_codes = true


