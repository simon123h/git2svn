[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "git2svn"
version = "0.1.0"
description = "CLI utility to synchronize changes from a local Git repository to a local SVN working copy"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Simon" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
]

[project.scripts]
git2svn = "git2svn.cli:main"

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
