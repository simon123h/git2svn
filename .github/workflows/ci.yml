name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-format:
    name: Lint & Format (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff Lint Checks
        run: ruff check .

      - name: Verify Formatting with Ruff
        run: ruff format --check .

  test:
    name: Test on Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Subversion (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y subversion git

      - name: Install Subversion (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install subversion git

      - name: Install Subversion (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install tortoisesvn -y --params:"/NoRestart"
          # Add TortoiseSVN CLI tools to PATH if present
          echo "C:\Program Files\TortoiseSVN\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install --retries 5 -e .[dev]

      - name: Run Unit & Integration Tests (with Coverage)
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        run: |
          coverage run -m unittest discover tests
          coverage xml

      - name: Run Unit & Integration Tests
        if: runner.os != 'Linux' || matrix.python-version != '3.12'
        run: python -m unittest discover tests

      - name: Upload Coverage to Codecov
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: unittests
          fail_ci_if_error: false

