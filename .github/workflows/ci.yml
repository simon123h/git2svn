name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-format-typecheck:
    name: Lint, Format & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Tooling
        run: pip install ruff mypy

      - name: Run Ruff Lint Checks
        run: ruff check .

      - name: Verify Formatting with Ruff
        run: ruff format --check .

      - name: Type Check with MyPy
        run: mypy git2svn

  test:
    name: Test on Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Subversion (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y subversion git

      - name: Install Subversion (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install subversion git

      - name: Install Subversion (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The Chocolatey community feed intermittently returns 504s. A failed 'choco install' does not fail
          # this step on its own (the step's exit code is that of its last command), so retry and check for
          # svn.exe explicitly instead of continuing without Subversion.
          $svnBin = "C:\Program Files\TortoiseSVN\bin"
          $hasSvn = { (Test-Path "$svnBin\svn.exe") -or [bool](Get-Command svn -ErrorAction SilentlyContinue) }
          foreach ($attempt in 1..4) {
            choco install tortoisesvn -y --params:"/NoRestart"
            if (& $hasSvn) { break }
            if ($attempt -lt 4) {
              Write-Host "TortoiseSVN install failed (attempt $attempt of 4), retrying in $($attempt * 15)s..."
              Start-Sleep -Seconds ($attempt * 15)
            }
          }
          if (-not (& $hasSvn)) { throw "TortoiseSVN could not be installed via Chocolatey" }
          # Add TortoiseSVN CLI tools to PATH for the following steps
          $svnBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify Subversion and Git are available
        run: |
          svn --version --quiet
          git --version

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install --retries 5 -e .[dev]

      - name: Run Unit & Integration Tests (with Coverage)
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        run: |
          coverage run -m unittest discover tests
          coverage xml

      - name: Run Unit & Integration Tests
        if: runner.os != 'Linux' || matrix.python-version != '3.12'
        run: python -m unittest discover tests

      - name: Upload Coverage to Codecov
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: unittests
          fail_ci_if_error: false

